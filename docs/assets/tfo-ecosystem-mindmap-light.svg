<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <title>TelemetryFlow Ecosystem Mindmap</title>
  <desc>Horizontal mindmap showing the TelemetryFlow ecosystem with 9 category branches and 21 product nodes</desc>

  <defs>
    <symbol id="tfo" viewBox="0 0 88 88">
      <g stroke="#14b8a6" stroke-width="5" stroke-linecap="round" fill="none">
        <line x1="44" y1="44" x2="44" y2="10"/><line x1="44" y1="44" x2="68" y2="20"/>
        <line x1="44" y1="44" x2="78" y2="44"/><line x1="44" y1="44" x2="68" y2="68"/>
        <line x1="44" y1="44" x2="44" y2="78"/><line x1="44" y1="44" x2="20" y2="68"/>
        <line x1="44" y1="44" x2="10" y2="44"/><line x1="44" y1="44" x2="20" y2="20"/>
      </g>
      <g fill="none" stroke="#f97316" stroke-width="4">
        <circle cx="44" cy="10" r="8"/><circle cx="68" cy="20" r="8"/>
        <circle cx="78" cy="44" r="8"/><circle cx="68" cy="68" r="8"/>
        <circle cx="44" cy="78" r="8"/><circle cx="20" cy="68" r="8"/>
        <circle cx="10" cy="44" r="8"/><circle cx="20" cy="20" r="8"/>
      </g>
      <circle cx="44" cy="44" r="14" fill="none" stroke="#14b8a6" stroke-width="5"/>
      <line x1="37" y1="37" x2="51" y2="51" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
      <line x1="51" y1="37" x2="37" y2="51" stroke="#14b8a6" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <radialGradient id="hubGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f0fdfa"/><stop offset="100%" stop-color="#99f6e4"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .cat{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:13px;font-weight:800}
    .prod{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:12px;font-weight:600;fill:#1e293b}
    .psub{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:9px;font-weight:500;fill:#64748b}
    .fut{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:12px;font-weight:600;fill:#94a3b8;font-style:italic}
    .futs{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:9px;font-weight:500;fill:#94a3b8}
    .hubt{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:13px;font-weight:800;fill:#0f172a}
    .hubs{font-family:system-ui,-apple-system,BlinkMacSystemFont,Roboto,sans-serif;font-size:8px;font-weight:700;fill:#0d9488;letter-spacing:2px}
  </style>

